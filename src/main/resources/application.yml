server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
app:
  ranking:
    api-key: ${DATA4LIBRARY_API_KEY:}
    base-url: ${DATA4LIBRARY_BASE_URL:https://data4library.kr/api}
    read-timeout: ${DATA4LIBRARY_READ_TIMEOUT:30s}
    refresh-cron: ${RANKING_REFRESH_CRON:0 0 0,6,12,18 * * *}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 30m
      refresh-token-ttl: 14d
    oauth2:
      front-callback-url: ${FRONT_CALLBACK_URL:http://localhost:3000/auth/callback}
      refresh-token-cookie-name: refresh_token
      cookie-secure: ${COOKIE_SECURE:false}
      cookie-same-site: Lax
    social-token:
      encryption-key: ${SOCIAL_TOKEN_ENCRYPTION_KEY}
    social-unlink:
      kakao-admin-key: ${KAKAO_ADMIN_KEY}
      naver-client-id: ${NAVER_CLIENT_ID}
      naver-client-secret: ${NAVER_CLIENT_SECRET}
spring:
  application:
    name: bookforest
  config:
    import: optional:file:${APP_CONFIG_DIR:.}/.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 30s
  http:
    clients:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:3s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:5s}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          kakao:
            provider: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
#              - account_email
            client-name: Kakao
          naver:
            provider: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - nickname
              - email
              - profile_image
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
